// Diagnostic fixture only: install as cryoffear/maps/c_apartment1_load.cfg.
// Launch windowed with +volume 0 and a bounded process (maximum 55 seconds).
alias ev_w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias ev_w100 "ev_w10;ev_w10;ev_w10;ev_w10;ev_w10;ev_w10;ev_w10;ev_w10;ev_w10;ev_w10"
alias ev_w500 "ev_w100;ev_w100;ev_w100;ev_w100;ev_w100"
volume 0
fps_max 60
joy_enable 0
joy_gyro_enable 0
m_ignore 1
sv_cheats 1
sv_enttools_enable 1
cof_entity_visibility_trace scene1_1
echo CUTSCENE-STARTUP
ev_w500
ev_w500
ent_list scene1_1
echo CUTSCENE-FORCED-HIDE
ent_fire scene1_1_inv setspawnflag 2
ent_fire scene1_1_inv use
ev_w100
echo CUTSCENE-FORCED-SHOW
ent_fire scene1_1_vis use
ev_w100
echo CUTSCENE-FORCED-HIDE-AGAIN
ent_fire scene1_1_inv use
ev_w100
echo CUTSCENE-MAP-SCENE
ent_fire multiscene1_1 use
ev_w500
ev_w500
ev_w100
echo CUTSCENE-FINISHED
cof_entity_visibility_trace ""
quit
